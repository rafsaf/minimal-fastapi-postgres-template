[project]
authors = [{ name = "admin", email = "admin@example.com" }]
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
]
description = "FastAPI project generated using minimal-fastapi-postgres-template."
name = "app"
requires-python = ">=3.15,<3.16"
version = "0.1.0-alpha"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "freezegun>=1.5.5",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "polyfactory>=3.5.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=100"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
filterwarnings = [""]
testpaths = ["app"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["alembic/*", "app/tests/*", "conftest.py", "test_*.py"]
source = ["app"]

[tool.mypy]
exclude = [".venv", "alembic"]
files = "app/**"
python_version = "3.15"
strict = true

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pylint, pyupgrade
ignore = ["E501"]
select = ["E", "F", "I", "PL", "UP", "W"]
